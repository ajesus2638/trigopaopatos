@media(max-width:700px){

line-height:1.3;
}

}

.cart h4{

.item{

/* CHECKOUT */

.checkout{

width:100%;

.box h2{

.box textarea,
.box select,
.box input{

padding:14px;

padding:16px;
border:none;
border-radius:18px;
background:#d2691e;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.finalizar:hover{
background:#b85a18;
}

.fechar{
margin-top:10px;
background:#ccc;
color:#333;
}

.card p{

<body>

<header>

🍞 TRIGO PÃO

<button class="perfil"
onclick="window.location.href='adm.html'">

<i class="fa-solid fa-user"></i>

</button>

</header>

<!-- BUSCA -->

<div class="search">

<input id="busca"
onkeyup="render()"
placeholder="Buscar pão, café, bolo...">

</div>

<!-- GRID -->

<div class="grid" id="grid"></div>

<!-- CARRINHO -->

<div class="cart">

<h4>

<i class="fa-solid fa-cart-shopping"></i>

Carrinho

</h4>

<div id="cart"></div>

<div class="total">

Total: R$ <span id="total">0.00</span>

</div>

</div>

<!-- BOTÃO -->

<button class="float"
onclick="openCheckout()">

<i class="fa-solid fa-bag-shopping"></i>

<span>Finalizar</span>

</button>

<!-- CHECKOUT -->

<div class="checkout" id="checkout">

<div class="box">

<h2>

<i class="fa-solid fa-basket-shopping"></i>

Finalizar Pedido

</h2>

<input type="text"
id="nome"
placeholder="Seu nome">

<input type="tel"
id="telefone"
placeholder="Seu telefone">

<input type="text"
id="endereco"
placeholder="Seu endereço">

<textarea id="obs"
placeholder="Observações do pedido..."></textarea>

<select id="pagamento">

<option>Pix</option>

<option>Cartão</option>

<option>Dinheiro</option>

</select>

<button class="finalizar"
onclick="finalizarPedido()">

<i class="fa-solid fa-check"></i>

Enviar Pedido

</button>

<button class="finalizar fechar"
onclick="fecharCheckout()">

Fechar

</button>

</div>
</div>

<script>

let carrinho=[];

let produtos =
JSON.parse(localStorage.getItem("produtos")) || [

{
nome:"Pão Francês",
preco:"0.80",
imagem:"https://cdn-icons-png.flaticon.com/512/1046/1046784.png"
},

{
nome:"Pão de Queijo",
preco:"3.00",
imagem:"https://cdn-icons-png.flaticon.com/512/6978/6978255.png"
},

{
nome:"Café",
preco:"4.50",
imagem:"https://cdn-icons-png.flaticon.com/512/590/590836.png"
}

];

function add(i){

let item =
carrinho.find(c=>c.nome===produtos[i].nome);

if(item){

item.qtd++;

}else{

carrinho.push({
...produtos[i],
qtd:1
});

}

renderCart();

}

function plus(i){

carrinho[i].qtd++;

renderCart();

}

function minus(i){

carrinho[i].qtd--;

if(carrinho[i].qtd<=0){

carrinho.splice(i,1);

}

renderCart();

}

function render(){

produtos =
JSON.parse(localStorage.getItem("produtos")) || [];

let busca =
document.getElementById("busca")
.value.toLowerCase();

let lista =
produtos.filter(p=>

p.nome.toLowerCase().includes(busca)

);

document.getElementById("grid").innerHTML =

lista.map((p)=>

`

<div class="card">

<img src="${p.imagem}">

<h3>${p.nome}</h3>

<p>
R$ ${parseFloat(p.preco).toFixed(2)}
</p>

<button class="add"
onclick="add(${produtos.indexOf(p)})">

+

</button>

</div>

`

).join("");

}

function renderCart(){

let total=0;

document.getElementById("cart").innerHTML =

carrinho.map((c,i)=>{

let preco =
parseFloat(c.preco);

total += preco*c.qtd;

return `

<div class="item">

<span>${c.nome} x${c.qtd}</span>

<div class="item-buttons">

<button class="btn plus"
onclick="plus(${i})">

+

</button>

<button class="btn minus"
onclick="minus(${i})">

-

</button>

</div>

</div>

`;

}).join("");

document.getElementById("total")
.innerText = total.toFixed(2);

}

function openCheckout(){

if(carrinho.length===0){

alert("Adicione itens!");

return;

}

document.getElementById("checkout")
.style.display="flex";

}

function fecharCheckout(){

document.getElementById("checkout")
.style.display="none";

}

function finalizarPedido(){

let nome =
document.getElementById("nome").value;

let telefone =
document.getElementById("telefone").value;

let endereco =
document.getElementById("endereco").value;

let obs =
document.getElementById("obs").value;

let pagamento =
document.getElementById("pagamento").value;

if(
nome==="" ||
telefone==="" ||
endereco===""
){

alert("Preencha os campos!");

return;

}

let pedido="";

carrinho.forEach(item=>{

pedido +=
`• ${item.nome} x${item.qtd}\n`;

});

let total =
document.getElementById("total")
.innerText;

let mensagem =

`*NOVO PEDIDO - TRIGO PÃO* 🍞

*Nome:* ${nome}

*Telefone:* ${telefone}

*Endereço:* ${endereco}

*Pedido:*
${pedido}

*Total:* R$ ${total}

*Pagamento:* ${pagamento}

*Observações:* ${obs}`;

let numero =
"553499791144";

let url =
`https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;

window.open(url,"_blank");

}

window.addEventListener("focus",()=>{
render();
});

render();

</script>

</body>
</html>
